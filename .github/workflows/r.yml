name: Ebola Analytics Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local workspace
        uses: actions/checkout@v4

      - name: Fetch remote repository data
        uses: actions/checkout@v4
        with:
          repository: webbegole/ebola-bundibugyo-tracker-2026
          path: external_repo_clone

      - name: Extract data spreadsheet
        run: |
          cp external_repo_clone/data/timeseries.csv ./downloaded_timeseries.csv
          rm -rf external_repo_clone

      - name: Install R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install Modeling Libraries
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "flexdashboard", "deSolve", "plotly"))'

      - name: Run Incremental Sync
        run: |
          Rscript incremental_fetch.R

      - name: Compile Dashboard
        run: |
          Rscript -e 'rmarkdown::render("dashboard.Rmd", output_file = "index.html")'

      - name: Save Cache Data
        run: |
          git config --global user.name "Automated Pipeline"
          git config --global user.email "pipeline@github-actions.internal"
          git add data_cache.csv || echo "No files"
          git commit -m "Automated update [skip ci]" || echo "No changes"
          git push origin main || echo "No push"

      - name: Publish Website Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true

