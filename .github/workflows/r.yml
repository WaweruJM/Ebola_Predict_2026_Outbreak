name: Ebola Analytics Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ebola-pipeline
  cancel-in-progress: false

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Fetch upstream tracker data
        uses: actions/checkout@v4
        with:
          repository: webbegole/ebola-bundibugyo-tracker-2026
          path: external_repo_clone
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract timeseries into workspace
        run: |
          cp external_repo_clone/data/timeseries.csv ./downloaded_timeseries.csv
          rm -rf external_repo_clone

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages
        run: |
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            dir.create(lib, recursive = TRUE, showWarnings = FALSE)
            .libPaths(c(lib, .libPaths()))
            options(repos = c(CRAN = "https://cloud.r-project.org"),
                    Ncpus = max(1L, parallel::detectCores() - 1L))
            pkgs <- c("jsonlite","readr","tibble","dplyr","tidyr",
                      "lubridate","ggplot2","knitr","rmarkdown","deSolve")
            need <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(need)) install.packages(need, lib = lib, dependencies = TRUE)
          '

      - name: Run incremental fetch
        run: Rscript -e 'source("incremental_fetch.R")'

      - name: Render dashboard
        run: |
          mkdir -p reports
          Rscript -e 'rmarkdown::render("dashboard.Rmd", output_file = "reports/dashboard.html")'

      # ---------------------------------------------------------
      # THIS IS THE CRITICAL FIX: ASSEMBLE THE ENTIRE SITE
      # ---------------------------------------------------------
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          
          # Copy every single required file and folder into the deploy dir
          cp index.html _site/
          cp -r css _site/
          cp -r js _site/
          cp -r data _site/
          cp -r reports _site/
          cp -r assets _site/     # <--- COPIES THE IMAGE
          cp -r docs _site/       # <--- COPIES THE RESOURCE PAGES
          
          touch _site/.nojekyll   # <--- PREVENTS GITHUB FROM IGNORING FOLDERS
          
          echo "=== VERIFY DEPLOYMENT CONTENTS ==="
          ls -la _site/assets/
          ls -la _site/docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false       # <--- FORCES A CLEAN OVERWRITE, NO STALE FILES
