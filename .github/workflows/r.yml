name: Streamlined Sequential Analytics Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo contents
        uses: actions/checkout@v4

      - name: Configure R Engine Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      - name: Load Base Compiler Tooling Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Provision R Matrix Libraries
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "flexdashboard", "deSolve", "plotly"))'

      - name: Download Live Remote Data via Linux Command Line
        run: |
          curl -L -o downloaded_timeseries.csv "https://githubusercontent.com"

      - name: Run Incremental Data Sync
        run: |
          Rscript incremental_fetch.R

      - name: Compile Layout Visuals
        run: |
          Rscript -e 'rmarkdown::render("dashboard.Rmd", output_file = "index.html")'

      - name: Commit Cache Delta Changes to Repository
        run: |
          git config --global user.name "Automated Pipeline"
          git config --global user.email "pipeline@github-actions.internal"
          git add data_cache.csv || echo "No cache file to add"
          git commit -m "Automated Pipeline: Appended incremental data rows [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      - name: Push Build Assets Live to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true


