name: Ebola Analytics Pipeline

on:
  schedule:
    - cron: '0 5 * * *'      # daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ebola-pipeline
  cancel-in-progress: false

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      # ---------- Fetch upstream data ----------
      - name: Fetch upstream tracker data
        uses: actions/checkout@v4
        with:
          repository: webbegole/ebola-bundibugyo-tracker-2026
          path: external_repo_clone
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract timeseries into workspace
        run: |
          cp external_repo_clone/data/timeseries.csv ./downloaded_timeseries.csv
          rm -rf external_repo_clone
          ls -la downloaded_timeseries.csv

      # ---------- R environment ----------
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # ---------- System libraries ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
            libtiff5-dev libjpeg-dev

      # ---------- R packages (cached) ----------
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('renv.lock', 'DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "httr", "jsonlite", "dplyr", "tidyr", "lubridate",
            "deSolve", "ggplot2", "rmarkdown", "knitr",
            "DT", "plotly", "scales", "forcats", "readr"
          ), repos = "https://cloud.r-project.org")'

      # ---------- Run analysis + emit JSON ----------
      - name: Run incremental fetch and export JSON
        run: Rscript incremental_fetch.R

      # ---------- Render R Markdown dashboard ----------
      - name: Render dashboard.Rmd
        run: |
          mkdir -p reports
          Rscript -e 'rmarkdown::render("dashboard.Rmd",
                       output_file = "reports/dashboard.html")'

      # ---------- Assemble deployable site ----------
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css  _site/
          cp -r js   _site/
          cp -r data _site/
          cp -r reports _site/
          touch _site/.nojekyll
          ls -R _site | head -50

      # ---------- Upload artifact (for inspection / fallback) ----------
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebola-portal-site
          path: _site/

      # ---------- Publish to gh-pages ----------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Automated update: ${{ github.run_id }}'
