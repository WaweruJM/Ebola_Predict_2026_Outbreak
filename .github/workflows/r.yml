name: Ebola Analytics Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ebola-pipeline
  cancel-in-progress: false

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest

    env:
      R_LIBS_USER: ${{ github.workspace }}/.Rlib

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Fetch upstream tracker data
        uses: actions/checkout@v4
        with:
          repository: webbegole/ebola-bundibugyo-tracker-2026
          path: external_repo_clone
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract timeseries into workspace
        run: |
          cp external_repo_clone/data/timeseries.csv ./downloaded_timeseries.csv
          rm -rf external_repo_clone
          ls -la downloaded_timeseries.csv
          head -3 downloaded_timeseries.csv

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Prepare R library directory
        run: |
          mkdir -p "$R_LIBS_USER"
          echo "R_LIBS_USER=$R_LIBS_USER" >> $GITHUB_ENV

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-4.4.3-${{ runner.os }}-${{ hashFiles('incremental_fetch.R', 'dashboard.Rmd') }}
          restore-keys: |
            r-4.4.3-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            dir.create(lib, recursive = TRUE, showWarnings = FALSE)
            .libPaths(c(lib, .libPaths()))
            options(repos = c(CRAN = "https://cloud.r-project.org"),
                    Ncpus = max(1L, parallel::detectCores() - 1L))
            pkgs <- c("jsonlite","readr","tibble","dplyr","tidyr",
                      "lubridate","ggplot2","knitr","rmarkdown","deSolve")
            need <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(need)) install.packages(need, lib = lib, dependencies = TRUE)
            missing <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(missing)) stop("Missing: ", paste(missing, collapse=", "))
            cat("All required R packages available.\n")
          '

      - name: Run incremental fetch and export JSON
        run: |
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            source("incremental_fetch.R")
          '

      - name: Verify JSON output
        run: |
          ls -la data/
          echo "=== generated_at ==="
          grep generated_at data/ebola_data.json
          echo "=== rows in cache ==="
          wc -l data_cache.csv

      - name: Render dashboard.Rmd
        run: |
          mkdir -p reports
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            rmarkdown::render("dashboard.Rmd",
                              output_file = "reports/dashboard.html",
                              quiet = FALSE)
          '
          ls -la reports/

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp    index.html _site/
          cp -r css        _site/
          cp -r js         _site/
          cp -r assets     _site/ 2>/dev/null || true
          cp -r reports    _site/
          rm -rf _site/data
          cp -r data       _site/
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebola-portal-site
          path: _site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          user_name:  'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Automated update: ${{ github.run_id }}'
