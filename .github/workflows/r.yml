name: Ebola Analytics Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.Rlib

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Fetch upstream tracker data
        uses: actions/checkout@v4
        with:
          repository: webbegole/ebola-bundibugyo-tracker-2026
          path: external_repo_clone
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract timeseries
        run: |
          cp external_repo_clone/data/timeseries.csv ./downloaded_timeseries.csv
          rm -rf external_repo_clone
          ls -la downloaded_timeseries.csv

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages
        run: |
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            dir.create(lib, recursive = TRUE, showWarnings = FALSE)
            .libPaths(c(lib, .libPaths()))
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            pkgs <- c("jsonlite","readr","tibble","dplyr","tidyr", "lubridate","ggplot2","knitr","rmarkdown","deSolve")
            need <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(need)) install.packages(need, lib = lib, dependencies = TRUE)
          '

      - name: Run incremental fetch and export JSON
        run: |
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            source("incremental_fetch.R")
          '

      # CRITICAL DEBUG STEP: Inspect the JSON to verify what R computed
      - name: Verify JSON output
        run: |
          echo "=== Inspecting the generated JSON ==="
          cat data/ebola_data.json | grep -A 5 "case_telemetry" | head -20

      - name: Render dashboard
        run: |
          mkdir -p reports
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            rmarkdown::render("dashboard.Rmd", output_file = "reports/dashboard.html")
          '

      # DELETE OLD FILES TO FORCE CACHE REFRESH
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp    index.html   _site/
          cp -r css          _site/
          cp -r js           _site/
          cp -r assets       _site/
          cp -r data         _site/
          cp -r reports      _site/
          cp -r docs         _site/
          touch _site/.nojekyll
          
          echo "=== Deployable Assets Verification ==="
          ls -la _site/data/ebola_data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false # <--- CRITICAL: This forces a clean deploy, removing old JSON
