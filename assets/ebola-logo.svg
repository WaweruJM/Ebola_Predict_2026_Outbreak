<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 620 200" width="620" height="200" role="img"
     aria-label="Ebola virus shaped as 2026">
  <defs>
    <radialGradient id="virusBody" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="#ff6b5b"/>
      <stop offset="55%"  stop-color="#e8392b"/>
      <stop offset="100%" stop-color="#8e1a10"/>
    </radialGradient>
    <linearGradient id="virusGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8b7a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c22010" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Helper: filament = a thick stroke with small droplets -->
  <style>
    .fil  { fill: none; stroke: url(#virusBody); stroke-linecap: round;
            stroke-linejoin: round; }
    .glow { fill: none; stroke: url(#virusGlow); stroke-opacity: 0.35;
            stroke-linecap: round; filter: blur(3px); }
    .droplet { fill: url(#virusBody); stroke: #6e110a; stroke-width: 1.5; }
    .dotted  { stroke: #2a0a08; stroke-width: 1; fill: none; opacity: 0.35; }
  </style>

  <!-- ================= 2 ================= -->
  <g transform="translate(0,0)">
    <path class="fil"   stroke-width="26" d="M25,180 C 25,80 95,20 95,20"/>
    <path class="glow"  stroke-width="34" d="M25,180 C 25,80 95,20 95,20"/>
    <path class="fil"   stroke-width="22" d="M25,180 Q 100,180 100,115 Q 100,60 40,60"/>
    <path class="glow"  stroke-width="30" d="M25,180 Q 100,180 100,115 Q 100,60 40,60"/>
    <!-- droplets -->
    <circle class="droplet" cx="18"  cy="120" r="7"/>
    <circle class="droplet" cx="35"  cy="40"  r="6"/>
    <circle class="droplet" cx="80"  cy="70"  r="6"/>
    <circle class="droplet" cx="55"  cy="195" r="5"/>
    <circle class="droplet" cx="120" cy="140" r="6"/>
  </g>

  <!-- ================= 0 ================= -->
  <g transform="translate(150,0)">
    <ellipse class="fil"  stroke-width="24" cx="55" cy="105" rx="52" ry="80"/>
    <ellipse class="glow" stroke-width="32" cx="55" cy="105" rx="52" ry="80"/>
    <circle class="droplet" cx="8"   cy="105" r="7"/>
    <circle class="droplet" cx="102" cy="105" r="7"/>
    <circle class="droplet" cx="55"  cy="20"  r="6"/>
    <circle class="droplet" cx="55"  cy="190" r="6"/>
  </g>

  <!-- ================= 2 ================= -->
  <g transform="translate(300,0)">
    <path class="fil"   stroke-width="26" d="M25,180 C 25,80 95,20 95,20"/>
    <path class="glow"  stroke-width="34" d="M25,180 C 25,80 95,20 95,20"/>
    <path class="fil"   stroke-width="22" d="M25,180 Q 100,180 100,115 Q 100,60 40,60"/>
    <path class="glow"  stroke-width="30" d="M25,180 Q 100,180 100,115 Q 100,60 40,60"/>
    <circle class="droplet" cx="18"  cy="120" r="7"/>
    <circle class="droplet" cx="35"  cy="40"  r="6"/>
    <circle class="droplet" cx="80"  cy="70"  r="6"/>
    <circle class="droplet" cx="55"  cy="195" r="5"/>
    <circle class="droplet" cx="120" cy="140" r="6"/>
  </g>

  <!-- ================= 6 ================= -->
  <g transform="translate(450,0)">
    <path class="fil"   stroke-width="24"
          d="M100,30 C 40,30 5,90 5,140 C 5,190 60,195 70,160
             C 80,125 40,110 20,120"/>
    <path class="glow"  stroke-width="32"
          d="M100,30 C 40,30 5,90 5,140 C 5,190 60,195 70,160
             C 80,125 40,110 20,120"/>
    <path class="fil"   stroke-width="20"
          d="M100,30 Q 30,50 15,120 Q 5,180 65,180 Q 115,175 115,140"/>
    <path class="glow"  stroke-width="28"
          d="M100,30 Q 30,50 15,120 Q 5,180 65,180 Q 115,175 115,140"/>
    <circle class="droplet" cx="95"  cy="22"  r="6"/>
    <circle class="droplet" cx="10"  cy="90"  r="6"/>
    <circle class="droplet" cx="70"  cy="190" r="6"/>
    <circle class="droplet" cx="118" cy="130" r="6"/>
  </g>
</svg>
